name: Daily Video Pipeline

on:
  schedule:
    - cron: '0 22 * * *'  # 每天 06:00 CST (22:00 UTC)
  workflow_dispatch:  # 手动触发

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: '1'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m src.main

      - name: Upload daily artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-output-${{ github.run_id }}
          path: output/${{ github.run_number }}/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## Daily Video Pipeline Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "output/${{ github.run_number }}/summary.json" ]; then
            cat "output/${{ github.run_number }}/summary.json" | jq -r 'to_entries[] | "- \(.key): \(.value)"' >> $GITHUB_STEP_SUMMARY
          fi
